<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Admin — KHALSTORE</title>
<style>
  body{font-family:sans-serif;background:#130D20;color:#F3EFFF;padding:24px;max-width:900px;margin:0 auto;}
  h1{color:#F4B740;}
  .order{background:#1C1531;border:1px solid #3a2f55;border-radius:10px;padding:16px;margin-bottom:12px;}
  .order b{color:#F4B740;}
  .status{display:inline-block;padding:4px 10px;border-radius:999px;font-size:12px;font-weight:700;}
  .status.menunggu_konfirmasi{background:#3a2f10;color:#F4B740;}
  .status.selesai{background:#0f3a24;color:#34D399;}
  .status.gagal{background:#3a1a1a;color:#F87171;}
  .status.diproses_digiflazz{background:#1a2a3a;color:#60A5FA;}
  button{background:#8B5CF6;color:#fff;border:none;padding:10px 18px;border-radius:8px;cursor:pointer;font-weight:700;margin-top:8px;}
  button:disabled{opacity:.5;cursor:not-allowed;}
  #refreshBtn{background:#334155;margin-bottom:16px;}
</style>
</head>
<body>
  <h1>Panel Admin — Order Masuk</h1>
  <button id="refreshBtn">🔄 Refresh</button>
  <div id="orderList">Memuat...</div>

<script>
  // Sesuaikan dengan URL backend kamu (Codespace forwarded URL / Render URL)
  const API_BASE_URL = "https://top-up-game-baru-mo18-theta.vercel.app";

  async function loadOrders() {
    const list = document.getElementById('orderList');
    list.textContent = 'Memuat...';
    try {
      const res = await fetch(`${API_BASE_URL}/api/orders`);
      const orders = await res.json();
      if (orders.length === 0) {
        list.innerHTML = '<p>Belum ada order masuk.</p>';
        return;
      }
      list.innerHTML = orders.slice().reverse().map(o => `
        <div class="order">
          <div><b>${o.ref_id}</b> — <span class="status ${o.status}">${o.status}</span></div>
          <div>Produk: ${o.product_id} | ID Tujuan: ${o.customer_no} | Harga: Rp${o.price?.toLocaleString('id-ID')}</div>
          <div>Waktu: ${new Date(o.created_at).toLocaleString('id-ID')}</div>
          ${o.sn ? `<div>SN: ${o.sn}</div>` : ''}
          ${o.message ? `<div>Pesan: ${o.message}</div>` : ''}
          ${o.status === 'menunggu_konfirmasi' ? `<button onclick="proses('${o.ref_id}', this)">✅ Sudah Bayar, Proses Sekarang</button>` : ''}
        </div>
      `).join('');
    } catch (err) {
      list.innerHTML = '<p style="color:#F87171">Gagal terhubung ke backend. Cek API_BASE_URL.</p>';
    }
  }

  async function proses(ref_id, btn) {
    btn.disabled = true;
    btn.textContent = 'Memproses...';
    try {
      const res = await fetch(`${API_BASE_URL}/api/order/${ref_id}/proses`, { method: 'POST' });
      const data = await res.json();
      if (!res.ok) throw new Error(data.error || 'Gagal');
      alert(`Order ${ref_id}: ${data.status}`);
    } catch (err) {
      alert('Gagal memproses: ' + err.message);
    }
    loadOrders();
  }

  document.getElementById('refreshBtn').addEventListener('click', loadOrders);
  loadOrders();
</script>
</body>
</html>
